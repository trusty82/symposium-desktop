name: Windows

# Construit l'installeur Windows (NSIS, sans certificat de signature) :
# - à chaque tag v* (ex. v0.1.0) : une Release GitHub est créée avec l'installeur .exe ;
# - à la demande (onglet Actions > Run workflow) : l'installeur reste un artefact du workflow.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dépendances
        run: npm ci

      - name: Tests Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Installeur (signé pour la mise à jour automatique)
        run: npx tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Fichier lu par les applications installées pour savoir s'il existe une nouvelle version.
      - name: latest.json (mise à jour automatique)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $sig = (Get-Content "$($exe.FullName).sig" -Raw).Trim()
          $tag = "${{ github.ref_name }}"
          $latest = [ordered]@{
            version   = $tag.TrimStart('v')
            notes     = "Symposium $tag"
            pub_date  = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = @{ 'windows-x86_64' = @{ signature = $sig; url = "https://github.com/${{ github.repository }}/releases/download/$tag/$($exe.Name)" } }
          }
          $latest | ConvertTo-Json -Depth 5 | Out-File src-tauri/target/release/bundle/nsis/latest.json -Encoding utf8NoBOM
          Get-Content src-tauri/target/release/bundle/nsis/latest.json

      - uses: actions/upload-artifact@v4
        with:
          name: Symposium-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Release GitHub (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Symposium ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json
          body: |
            Installeur Windows de l'application Symposium. Les applications déjà installées se mettent à jour toutes seules.

            L'installeur n'est pas signé : à la première installation, Windows affiche « Windows a protégé votre ordinateur ».
            Clique sur **Informations complémentaires**, puis **Exécuter quand même**.
