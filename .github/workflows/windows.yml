name: Windows

# Construit l'installeur Windows (NSIS, sans certificat de signature) :
# - à chaque tag v* (ex. v0.1.0) : une Release GitHub est créée avec l'installeur .exe ;
# - à la demande (onglet Actions > Run workflow) : l'installeur reste un artefact du workflow.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dépendances
        run: npm ci

      - name: Tests Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Installeur
        run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: Symposium-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Release GitHub (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Symposium ${{ github.ref_name }}
          files: src-tauri/target/release/bundle/nsis/*.exe
          body: |
            Installeur Windows de l'application Symposium.

            L'installeur n'est pas signé : à la première installation, Windows affiche « Windows a protégé votre ordinateur ».
            Clique sur **Informations complémentaires**, puis **Exécuter quand même**.
